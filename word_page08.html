<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>영어 단어 학습 - 8단원</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Playfair+Display:wght@700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #faf6f0;
  --card: #ffffff;
  --ink: #1a1a2e;
  --sub: #6b7280;
  --accent: #e07a5f;
  --accent2: #3d405b;
  --correct: #06d6a0;
  --wrong: #ef476f;
  --border: #e8e0d4;
  --shadow: 0 4px 24px rgba(26,26,46,0.08);
  --shadow-lg: 0 12px 48px rgba(26,26,46,0.12);
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: 'Noto Sans KR', sans-serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  overflow-x: hidden;
}

/* HEADER */
.header {
  display: flex;
  align-items: baseline;
  justify-content: center;
  gap: 12px;
  padding: 14px 24px 12px;
  position: relative;
}
.header::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent) 25%, var(--accent) 75%, transparent);
  border-radius: 2px;
}
.header h1 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(22px, 3vw, 30px);
  font-weight: 900;
  color: var(--accent2);
  letter-spacing: -1px;
}
.header p {
  color: var(--sub);
  margin-top: 0;
  font-size: 14px;
  font-weight: 300;
}

/* NAV */
.nav {
  display: flex;
  justify-content: center;
  gap: 8px;
  padding: 14px 16px 10px;
  flex-wrap: wrap;
}
.nav-btn {
  padding: 10px 22px;
  border: 2px solid var(--border);
  background: var(--card);
  border-radius: 100px;
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 14px;
  font-weight: 500;
  color: var(--sub);
  cursor: pointer;
  transition: all 0.3s ease;
}
.nav-btn:hover { border-color: var(--accent); color: var(--accent); }
.nav-btn.active {
  background: var(--accent2);
  border-color: var(--accent2);
  color: #fff;
}

/* SECTIONS */
.section { display: none; max-width: 720px; margin: 0 auto; padding: 8px 20px 16px; }
.section.active { display: block; }

/* FLASH CARD */
.flash-progress {
  text-align: center;
  font-size: 13px;
  color: var(--sub);
  margin-bottom: 6px;
  font-weight: 500;
  letter-spacing: 1px;
}
.flash-container {
  perspective: 1200px;
  height: 300px;
  cursor: pointer;
  margin-bottom: 10px;
}
.flash-card {
  width: 100%;
  height: 100%;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
}
.flash-card.flipped { transform: rotateY(180deg); }

.flash-front, .flash-back {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  border-radius: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 12px 28px;
  box-shadow: var(--shadow-lg);
}
.flash-front {
  background: linear-gradient(145deg, #3d405b 0%, #2a2d42 100%);
  color: #fff;
}
.flash-back {
  background: var(--card);
  transform: rotateY(180deg);
  border: 2px solid var(--border);
}
.flash-word {
  font-family: 'Playfair Display', serif;
  font-size: clamp(34px, 8vw, 48px);
  font-weight: 900;
  margin-bottom: 8px;
}
.flash-pron-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
}
.flash-pron {
  font-size: 16px;
  opacity: 0.75;
  font-weight: 400;
  line-height: 1.4;
}
.flash-ipa {
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px;
  opacity: 0.6;
}
.flash-pos {
  display: inline-block;
  padding: 3px 12px;
  border-radius: 100px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 1px;
  margin-bottom: 8px;
}
.flash-front .flash-pos {
  background: rgba(255,255,255,0.15);
  color: rgba(255,255,255,0.8);
}
.flash-back .flash-pos {
  background: #f0eef5;
  color: var(--accent2);
}
.flash-tap {
  font-size: 12px;
  opacity: 0.4;
  position: absolute;
  bottom: 24px;
  letter-spacing: 2px;
  text-transform: uppercase;
}
/* TTS BUTTON */
.tts-btn {
  background: none;
  border: none;
  cursor: pointer;
  font-size: 18px;
  opacity: 0.65;
  padding: 2px 4px;
  border-radius: 6px;
  transition: all 0.2s;
  line-height: 1;
  vertical-align: middle;
}
.tts-btn:hover { opacity: 1; transform: scale(1.15); }
.tts-btn.speaking { opacity: 1; animation: tts-pulse 0.6s infinite alternate; }
@keyframes tts-pulse {
  from { transform: scale(1); }
  to   { transform: scale(1.2); }
}
.flash-word-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}
.quiz-question-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}
.tts-ex-row {
  display: flex;
  align-items: flex-start;
  gap: 6px;
}
.tts-ex-row .tts-btn { margin-top: 1px; font-size: 14px; }
.flash-meaning {
  font-size: clamp(28px, 6vw, 38px);
  font-weight: 700;
  color: var(--accent2);
  margin-bottom: 20px;
  text-align: center;
}
.flash-example {
  background: #f8f5f0;
  border-radius: 12px;
  padding: 16px 20px;
  width: 100%;
  max-width: 400px;
}
.flash-example-en {
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px;
  color: var(--ink);
  font-weight: 400;
  margin-bottom: 4px;
  line-height: 1.6;
}
.flash-example-en .hl {
  color: var(--accent);
  font-weight: 700;
  background: rgba(224,122,95,0.1);
  padding: 1px 4px;
  border-radius: 4px;
}
.flash-example-pron {
  font-size: 12px;
  color: #9ca3af;
  margin-bottom: 6px;
  line-height: 1.5;
}
.flash-example-ko {
  font-size: 13px;
  color: var(--sub);
  line-height: 1.5;
}

.flash-nav {
  display: flex;
  justify-content: center;
  gap: 12px;
}
.flash-nav button {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 2px solid var(--border);
  background: var(--card);
  font-size: 18px;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
}
.flash-nav button:hover {
  background: var(--accent2);
  border-color: var(--accent2);
  color: #fff;
}
.flash-nav .shuffle-btn {
  width: auto;
  border-radius: 100px;
  padding: 0 24px;
  font-size: 13px;
  font-family: 'Noto Sans KR', sans-serif;
  font-weight: 500;
}

/* QUIZ */
.quiz-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}
.quiz-score {
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px;
  color: var(--sub);
}
.quiz-score span { color: var(--accent); font-weight: 600; }
.quiz-card {
  background: var(--card);
  border-radius: 20px;
  padding: 16px 24px;
  box-shadow: var(--shadow);
  text-align: center;
  margin-bottom: 10px;
}
.quiz-label {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: var(--sub);
  margin-bottom: 16px;
}
.quiz-question {
  font-size: clamp(26px, 6vw, 36px);
  font-weight: 700;
  color: var(--accent2);
  line-height: 1.3;
}
.quiz-options {
  display: grid;
  gap: 10px;
}
.quiz-option {
  padding: 16px 20px;
  border: 2px solid var(--border);
  border-radius: 14px;
  background: var(--card);
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 16px;
  cursor: pointer;
  transition: all 0.2s;
  text-align: left;
  color: var(--ink);
}
.quiz-option:hover:not(.disabled) {
  border-color: var(--accent2);
  background: #f0eef5;
}
.quiz-option.correct {
  border-color: var(--correct);
  background: #e8faf3;
  color: #047857;
}
.quiz-option.wrong {
  border-color: var(--wrong);
  background: #fef0f3;
  color: #be123c;
}
.quiz-option.disabled { cursor: default; opacity: 0.6; }
.quiz-option.disabled.correct { opacity: 1; }

/* SHORT ANSWER INPUT */
.answer-area { margin-top: 8px; }
.answer-input-row {
  display: flex;
  gap: 8px;
  align-items: stretch;
}
.answer-input {
  flex: 1;
  padding: 12px 16px;
  border: 2px solid var(--border);
  border-radius: 14px;
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 17px;
  color: var(--ink);
  background: var(--card);
  outline: none;
  transition: border-color 0.2s;
  min-width: 0;
}
.answer-input:focus { border-color: var(--accent2); }
.answer-input.correct-input { border-color: var(--correct); background: #e8faf3; }
.answer-input.wrong-input { border-color: var(--wrong); background: #fef0f3; }
.answer-input:disabled { opacity: 0.7; }
.submit-btn {
  padding: 0 20px;
  border-radius: 14px;
  border: none;
  background: var(--accent2);
  color: #fff;
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
  flex-shrink: 0;
}
.submit-btn:hover { opacity: 0.9; }
.submit-btn:disabled { opacity: 0.4; cursor: default; }
.answer-hint {
  font-size: 11px;
  color: var(--sub);
  margin-top: 5px;
  text-align: center;
}
.answer-result-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 8px;
  min-height: 40px;
}
.answer-feedback {
  flex: 1;
  padding: 8px 14px;
  border-radius: 10px;
  font-size: 14px;
  display: none;
  line-height: 1.4;
}
.answer-feedback.show { display: block; }
.answer-feedback.correct-fb { background: #e8faf3; color: #047857; }
.answer-feedback.wrong-fb { background: #fef0f3; color: #be123c; }
.answer-actions {
  display: flex;
  gap: 6px;
  flex-shrink: 0;
}
.retry-btn {
  padding: 7px 14px;
  border-radius: 100px;
  border: 2px solid var(--accent);
  background: transparent;
  color: var(--accent);
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  display: none;
  transition: all 0.2s;
  white-space: nowrap;
}
.retry-btn.show { display: inline-block; }
.retry-btn:hover { background: var(--accent); color: #fff; }
.quiz-next {
  display: none;
  padding: 7px 18px;
  border-radius: 100px;
  border: none;
  background: var(--accent2);
  color: #fff;
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
  margin: 0;
}
.quiz-next:hover { opacity: 0.9; }
.quiz-next.show { display: inline-block; }

/* FINAL TEST */
.test-intro {
  text-align: center;
  padding: 60px 20px;
}
.test-intro h2 {
  font-family: 'Playfair Display', serif;
  font-size: 28px;
  margin-bottom: 12px;
  color: var(--accent2);
}
.test-intro p { color: var(--sub); margin-bottom: 32px; line-height: 1.6; }
.start-btn {
  padding: 14px 48px;
  border-radius: 100px;
  border: none;
  background: var(--accent);
  color: #fff;
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s;
  box-shadow: 0 4px 16px rgba(224,122,95,0.3);
}
.start-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(224,122,95,0.4); }

.test-progress-bar {
  width: 100%;
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  margin-bottom: 24px;
  overflow: hidden;
}
.test-progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  border-radius: 3px;
  transition: width 0.4s ease;
}
.test-counter {
  text-align: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  color: var(--sub);
  margin-bottom: 20px;
}

/* RESULTS */
.results {
  text-align: center;
  padding: 40px 20px;
}
.results-circle {
  width: 160px;
  height: 160px;
  margin: 0 auto 24px;
  position: relative;
}
.results-circle svg { transform: rotate(-90deg); }
.results-circle .score-text {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.results-circle .score-num {
  font-family: 'Playfair Display', serif;
  font-size: 42px;
  font-weight: 900;
  color: var(--accent2);
}
.results-circle .score-label {
  font-size: 12px;
  color: var(--sub);
  letter-spacing: 1px;
}
.results h2 {
  font-size: 24px;
  margin-bottom: 8px;
  color: var(--accent2);
}
.results p { color: var(--sub); margin-bottom: 24px; }
.wrong-list {
  text-align: left;
  background: var(--card);
  border-radius: 16px;
  padding: 24px;
  margin-top: 24px;
  box-shadow: var(--shadow);
}
.wrong-list h3 {
  font-size: 15px;
  color: var(--wrong);
  margin-bottom: 16px;
}
.wrong-item {
  display: flex;
  justify-content: space-between;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
  font-size: 14px;
}
.wrong-item:last-child { border-bottom: none; }
.wrong-item .en { font-weight: 600; color: var(--accent2); }
.wrong-item .ko { color: var(--sub); }

/* ANIMATIONS */
@keyframes fadeUp {
  from { opacity:0; transform: translateY(20px); }
  to { opacity:1; transform: translateY(0); }
}
.fade-up { animation: fadeUp 0.4s ease forwards; }

@keyframes pulse {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.02); }
}

/* RESPONSIVE */
/* QUIZ WORD INFO */
.quiz-word-info {
  margin-top: 8px;
  font-size: 14px;
  color: var(--sub);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  flex-wrap: wrap;
}
.quiz-word-ipa {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  color: #9ca3af;
}
.quiz-word-pos {
  display: inline-block;
  padding: 2px 9px;
  border-radius: 100px;
  font-size: 11px;
  font-weight: 600;
  background: #f0eef5;
  color: var(--accent2);
}

@media (max-width: 500px) {
  .flash-container { height: 280px; }
  .flash-front, .flash-back { padding: 10px 16px; }
  .quiz-card { padding: 28px 20px; }
  .nav { gap: 6px; }
  .nav-btn { padding: 8px 16px; font-size: 13px; }
}
</style>
</head>
<body>

<div class="header">
  <h1>Vocabulary Study</h1>
  <p>영어 단어 학습 - 8단원</p>
</div>

<nav class="nav">
  <button class="nav-btn active" onclick="showSection('flash')">📇 플래시카드</button>
  <button class="nav-btn" onclick="showSection('en2ko')">🇬🇧→🇰🇷 영→한</button>
  <button class="nav-btn" onclick="showSection('ko2en')">🇰🇷→🇬🇧 한→영</button>
  <button class="nav-btn" onclick="showSection('test')">📝 최종시험</button>
  <button class="nav-btn" onclick="showSection('wrong')" id="wrong-nav">📕 오답노트 <span id="wrong-badge" style="display:none;background:var(--wrong);color:#fff;border-radius:50%;padding:1px 7px;font-size:11px;margin-left:4px;"></span></button>
</nav>

<div id="flash-section" class="section active"></div>
<div id="en2ko-section" class="section"></div>
<div id="ko2en-section" class="section"></div>
<div id="test-section" class="section"></div>
<div id="wrong-section" class="section"></div>

<script>
const WORDS = [
  { en:"flight", ko:"비행, 날기", pron:"플라이트", ipa:"/flaɪt/", pos:"명사", ex:"The flight took three hours.", exPron:"더 플라이트 툭 쓰리 아워즈.", exKo:"비행이 세 시간 걸렸다." },
  { en:"fruit", ko:"과일", pron:"프루트", ipa:"/fruːt/", pos:"명사", ex:"I eat fruit every morning.", exPron:"아이 잇 프루트 에브리 모닝.", exKo:"나는 매일 아침 과일을 먹는다." },
  { en:"monkey", ko:"원숭이", pron:"멍키", ipa:"/ˈmʌŋ.ki/", pos:"명사", ex:"The monkey climbed the tree.", exPron:"더 멍키 클라임드 더 트리.", exKo:"원숭이가 나무를 올랐다." },
  { en:"million", ko:"100만, 100만의", pron:"밀리언", ipa:"/ˈmɪl.jən/", pos:"명사·형용사", ex:"There are a million stars in the sky.", exPron:"데어 아 어 밀리언 스타즈 인 더 스카이.", exKo:"하늘에는 수백만 개의 별이 있다." },
  { en:"certainly", ko:"확실히, 꼭", pron:"서틀리", ipa:"/ˈsɜːr.tən.li/", pos:"부사", ex:"I will certainly come to the party.", exPron:"아이 윌 서틀리 컴 투 더 파티.", exKo:"나는 반드시 파티에 갈 것이다." },
  { en:"classmate", ko:"동급생, 급우", pron:"클래스메이트", ipa:"/ˈklæs.meɪt/", pos:"명사", ex:"She is my classmate.", exPron:"쉬 이즈 마이 클래스메이트.", exKo:"그녀는 나의 동급생이다." },
  { en:"west", ko:"서쪽, 서쪽의", pron:"웨스트", ipa:"/west/", pos:"명사·형용사", ex:"The sun sets in the west.", exPron:"더 선 셋츠 인 더 웨스트.", exKo:"태양은 서쪽으로 진다." },
  { en:"map", ko:"지도", pron:"맵", ipa:"/mæp/", pos:"명사", ex:"Let me check the map.", exPron:"렛 미 첵 더 맵.", exKo:"지도를 확인해 보자." },
  { en:"tie", ko:"매다, 동점이 되다", pron:"타이", ipa:"/taɪ/", pos:"동사", ex:"Please tie your shoelaces.", exPron:"플리즈 타이 유어 슈레이시즈.", exKo:"신발 끈을 묶어라." },
  { en:"push", ko:"밀다", pron:"푸시", ipa:"/pʊʃ/", pos:"동사", ex:"Push the door to open it.", exPron:"푸시 더 도어 투 오픈 잇.", exKo:"문을 밀어서 열어라." },
  { en:"pen pal", ko:"펜팔, 편지 친구", pron:"펜 팔", ipa:"/ˈpen pæl/", pos:"명사", ex:"I have a pen pal in France.", exPron:"아이 해브 어 펜 팔 인 프랑스.", exKo:"나는 프랑스에 펜팔 친구가 있다." },

/* ===== TEXT-TO-SPEECH ===== */
let ttsUtter = null;
function speak(text, btnEl) {
  // Android WebView: 네이티브 TTS 브릿지 사용
  if (window.AndroidBridge && typeof AndroidBridge.speak === 'function') {
    document.querySelectorAll('.tts-btn.speaking').forEach(b => {
      b.classList.remove('speaking'); b.dataset.speaking = '0';
    });
    if (btnEl && btnEl.dataset.speaking === '1') {
      AndroidBridge.stopSpeak();
      btnEl.dataset.speaking = '0';
      return;
    }
    AndroidBridge.speak(text, 'en-US');
    if (btnEl) {
      btnEl.classList.add('speaking');
      btnEl.dataset.speaking = '1';
      setTimeout(() => {
        btnEl.classList.remove('speaking');
        btnEl.dataset.speaking = '0';
      }, Math.max(1500, text.length * 80));
    }
    return;
  }
  // Web Speech API (브라우저 환경 fallback)
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  document.querySelectorAll('.tts-btn.speaking').forEach(b => b.classList.remove('speaking'));
  if (ttsUtter && ttsUtter._text === text && btnEl && btnEl.dataset.speaking === '1') {
    btnEl.dataset.speaking = '0';
    return;
  }
  const u = new SpeechSynthesisUtterance(text);
  u._text = text;
  u.lang = 'en-US';
  u.rate = 0.9;
  u.pitch = 1;
  const voices = window.speechSynthesis.getVoices();
  const enVoice = voices.find(v => v.lang.startsWith('en') && v.localService) ||
                  voices.find(v => v.lang.startsWith('en'));
  if (enVoice) u.voice = enVoice;
  if (btnEl) {
    btnEl.classList.add('speaking');
    btnEl.dataset.speaking = '1';
    u.onend = u.onerror = () => {
      btnEl.classList.remove('speaking');
      btnEl.dataset.speaking = '0';
    };
  }
  ttsUtter = u;
  window.speechSynthesis.speak(u);
}
function speakBtn(text, el) {
  speak(text, el);
  event.stopPropagation();
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function showSection(id) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(id + '-section').classList.add('active');
  const tabs = ['flash','en2ko','ko2en','test','wrong'];
  document.querySelectorAll('.nav-btn').forEach((b, i) => {
    if (tabs[i] === id) b.classList.add('active');
  });
  if (id === 'flash') renderFlash();
  if (id === 'en2ko') initQuiz('en2ko');
  if (id === 'ko2en') initQuiz('ko2en');
  if (id === 'test') renderTestIntro();
  if (id === 'wrong') renderWrongNote();
}

function highlightWord(sentence, word) {
  const regex = new RegExp('(' + word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '[a-z]*)', 'gi');
  return sentence.replace(regex, '<span class="hl">$1</span>');
}

/* ===== ANSWER CHECKING ===== */
function normalize(s) {
  return s.trim().toLowerCase()
    .replace(/~/g, '')
    .replace(/\s+/g, '')
    .replace(/[.。]/g, '');
}

function checkAnswer(userInput, correctWord, mode) {
  const input = normalize(userInput);
  if (!input) return false;

  if (mode === 'ko2en') {
    return input === normalize(correctWord.en);
  }

  const parts = correctWord.ko.split(/[,、]/).map(s => normalize(s));
  const full = normalize(correctWord.ko);
  const userParts = userInput.split(/[,、]/).map(s => normalize(s)).filter(Boolean);

  for (const up of userParts) {
    if (parts.some(p => p === up || p.includes(up) || up.includes(p))) return true;
  }
  if (input === full) return true;
  return false;
}

/* ===== GLOBAL WRONG NOTE ===== */
let wrongBook = {};

function addToWrongBook(w, source) {
  if (!wrongBook[w.en]) {
    const orig = WORDS.find(x => x.en === w.en);
    wrongBook[w.en] = { ...orig, sources: new Set() };
  }
  wrongBook[w.en].sources.add(source);
  updateBadge();
}

function removeFromWrongBook(en) {
  delete wrongBook[en];
  updateBadge();
}

function clearWrongBook() {
  wrongBook = {};
  updateBadge();
}

function updateBadge() {
  const count = Object.keys(wrongBook).length;
  const badge = document.getElementById('wrong-badge');
  if (count > 0) {
    badge.style.display = 'inline';
    badge.textContent = count;
  } else {
    badge.style.display = 'none';
  }
}

    </div>`;

  setTimeout(() => { const el = document.getElementById(mode+'-input'); if(el) el.focus(); }, 100);
}

function submitQuizAnswer(mode) {
  const st = quizState[mode];
  if (st.answered) return;
  st.answered = true;
  if (!st.retrying) st.total++;

  const wIdx = st.order[st.idx];
  const w = WORDS[wIdx];
  const input = document.getElementById(mode + '-input');
  const feedback = document.getElementById(mode + '-feedback');
  const submitBtn = document.getElementById(mode + '-submit');

  const isCorrect = checkAnswer(input.value, w, mode);
  input.disabled = true;
  submitBtn.disabled = true;

  if (isCorrect) {
    if (!st.retrying) st.correct++;
    input.classList.add('correct-input');
    feedback.className = 'answer-feedback show correct-fb';
    feedback.innerHTML = st.retrying ? '✅ 재도전 성공!' : '✅ 정답입니다!';
  } else {
    input.classList.add('wrong-input');
    feedback.className = 'answer-feedback show wrong-fb';
    const correctAnswer = mode === 'en2ko' ? w.ko : w.en;
    feedback.innerHTML = '❌ 오답! 정답: <strong>' + correctAnswer + '</strong>';
    if (!st.retrying) {
      st.wrongs.push({ en: w.en, ko: w.ko });
      addToWrongBook(w, mode === 'en2ko' ? '영→한' : '한→영');
      document.getElementById(mode + '-retry').classList.add('show');
    }
  }
  st.retrying = false;
  document.getElementById(mode + '-next').classList.add('show');
}

function retryQuiz(mode) {
  const st = quizState[mode];
  st.answered = false;
  st.retrying = true;
  const input = document.getElementById(mode + '-input');
  input.value = '';
  input.disabled = false;
  input.className = 'answer-input';
  document.getElementById(mode + '-submit').disabled = false;
  document.getElementById(mode + '-feedback').className = 'answer-feedback';
  document.getElementById(mode + '-retry').classList.remove('show');
  document.getElementById(mode + '-next').classList.remove('show');
  input.focus();
}

function nextQuiz(mode) {
  quizState[mode].idx++;
  quizState[mode].retrying = false;
  renderQuiz(mode);
}

function renderQuizDone(mode) {
  const st = quizState[mode];
  const pct = Math.round((st.correct / WORDS.length) * 100);
  const sec = document.getElementById(mode + '-section');

  const unique = [];
  const seen = new Set();
  st.wrongs.forEach(w => { if (!seen.has(w.en)) { seen.add(w.en); unique.push(w); } });

  let wrongHtml = '';
  if (unique.length > 0) {
    wrongHtml = `
      <div class="wrong-list">
        <h3>틀린 단어 (${unique.length}개) → 오답노트에 저장됨</h3>
        ${unique.map(w => `<div class="wrong-item"><span class="en">${w.en}</span><span class="ko">${w.ko}</span></div>`).join('')}
      </div>`;
  }

  sec.innerHTML = `
    <div class="results fade-up">
      ${renderCircle(pct)}
      <h2>${pct >= 80 ? '훌륭합니다! 🎉' : pct >= 50 ? '잘했어요! 💪' : '조금 더 연습해요! 📖'}</h2>
      <p>${WORDS.length}문제 중 ${st.correct}개 정답</p>
      <button class="start-btn" onclick="initQuiz('${mode}')">다시 풀기</button>
      ${unique.length > 0 ? `<br><br><button class="start-btn" style="background:var(--accent2)" onclick="showSection('wrong')">📕 오답노트로 이동</button>` : ''}
      ${wrongHtml}
    </div>`;
}

function submitTestAnswer() {

function startWrongQuiz(mode) {
  const items = Object.values(wrongBook);
  if (items.length === 0) { renderWrongNote(); return; }

  const questions = [];
  items.forEach(w => {
    const wIdx = WORDS.findIndex(x => x.en === w.en);
    if (mode === 'mixed') {
      questions.push({ wIdx, mode: Math.random() < 0.5 ? 'en2ko' : 'ko2en' });
    } else {
      questions.push({ wIdx, mode });
    }
  });

  wrongNoteState = { questions: shuffle(questions), idx: 0, correct: 0, wrongs: [], answered: false, totalQ: questions.length };
  renderWrongQ();
}

function renderWrongResult() {
  const t = wrongNoteState;
  const pct = t.totalQ > 0 ? Math.round((t.correct / t.totalQ) * 100) : 0;
  let msg = '';
  if (pct === 100) msg = '모두 맞혔습니다! 🏆';
  else if (pct >= 70) msg = '거의 다 외웠어요! 💪';
  else msg = '다시 복습해 봐요! 📖';

  const remaining = Object.keys(wrongBook).length;

  document.getElementById('wrong-section').innerHTML = `
    <div class="results fade-up">
      ${renderCircle(pct)}

        <button class="start-btn" onclick="showSection('wrong')">오답노트로 돌아가기</button>` :
        `<p style="font-size:14px;color:var(--correct);font-weight:600;">오답노트가 비었습니다! 🎉</p>
        <button class="start-btn" onclick="showSection('flash')">전체 복습하기</button>`}
    </div>`;
}

function renderCircle(pct) {
  const r = 68, c = 2 * Math.PI * r;
  const offset = c - (pct / 100) * c;
  const color = pct >= 80 ? 'var(--correct)' : pct >= 50 ? 'var(--accent)' : 'var(--wrong)';
  return `
    <div class="results-circle">
      <svg width="160" height="160" viewBox="0 0 160 160">
        <circle cx="80" cy="80" r="${r}" fill="none" stroke="var(--border)" stroke-width="8"/>
        <circle cx="80" cy="80" r="${r}" fill="none" stroke="${color}" stroke-width="8"
          stroke-dasharray="${c}" stroke-dashoffset="${offset}" stroke-linecap="round"/>
      </svg>
      <div class="score-text">
        <div class="score-num">${pct}%</div>
        <div class="score-label">정답률</div>
      </div>
    </div>`;
}

/* ===== GOOGLE SHEETS SAVE ===== */
const SHEET_URL_KEY = 'gsheet_url_mideng';

function saveToSheet() {
  let url = localStorage.getItem(SHEET_URL_KEY);
  if (!url) {
    url = prompt('Google Apps Script 웹 앱 URL을 입력하세요.\n\n(설정 방법은 아래 안내를 참고하세요)');
    if (!url) return;
    localStorage.setItem(SHEET_URL_KEY, url.trim());
    url = url.trim();
  }
  const t = testState;
  const pct = Math.round((t.correct / t.questions.length) * 100);
  const unique = [];
  const seen = new Set();
  t.wrongs.forEach(w => { if (!seen.has(w.en)) { seen.add(w.en); unique.push(w); } });

  const data = {
    date: new Date().toLocaleString('ko-KR', { timeZone: 'Asia/Seoul' }),
    page: document.title,
    total: t.questions.length,
    correct: t.correct,
    score: pct,
    wrong: unique.map(w => w.en).join(', ')
  };

  const btn = document.getElementById('sheet-save-btn');
  if (btn) { btn.disabled = true; btn.textContent = '저장 중...'; }

  fetch(url, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  }).then(() => {
    if (btn) { btn.textContent = '✅ 저장 완료!'; }
  }).catch(err => {
    if (btn) { btn.disabled = false; btn.textContent = '📊 구글 시트 저장'; }
    alert('저장 실패: ' + err.message + '\n\nURL을 초기화하려면 다시 버튼을 누르세요.');
    localStorage.removeItem(SHEET_URL_KEY);
  });
}

/* ===== GLOBAL KEYBOARD SHORTCUTS ===== */
document.addEventListener('keydown', function(e) {
  const active = document.activeElement;
  const inputFocused = active && active.tagName === 'INPUT' && !active.disabled;

  // Flash card: Space = flip, Enter/ArrowRight = next, ArrowLeft = prev
  const flashSection = document.getElementById('flash-section');
  if (flashSection && flashSection.classList.contains('active')) {
    if (inputFocused) return;
    if (e.key === ' ') { e.preventDefault(); flipCard(); }
    else if (e.key === 'Enter' || e.key === 'ArrowRight') { e.preventDefault(); flashNext(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); flashPrev(); }
    return;
  }

  // Quiz: Enter after answering → next question
  if (e.key !== 'Enter') return;
  if (inputFocused) return; // let input's own onkeydown handle it

  if (activeQuizMode === 'en2ko' || activeQuizMode === 'ko2en') {
    const st = quizState[activeQuizMode];
    if (st && st.answered) nextQuiz(activeQuizMode);
  } else if (activeQuizMode === 'test') {
    if (testState.answered) nextTest();
  } else if (activeQuizMode === 'wrong') {
    if (wrongNoteState.answered) { wrongNoteState.idx++; renderWrongQ(); }
  }
});

// Init
renderFlash();
</script>
</body>
</html>
